<main class="contenedor">
  <h1>Sistema de Gestión de Tareas</h1>
  <p>Organiza el trabajo del equipo con información actualizada.</p>
  <form (ngSubmit)="guardar()" #tareaForm="ngForm">
    <label for="titulo">Título *</label>
    <input id="titulo" name="titulo" [(ngModel)]="formulario.titulo" required maxlength="150">
    <label for="descripcion">Descripción</label>
    <textarea id="descripcion" name="descripcion" [(ngModel)]="formulario.descripcion" rows="3"></textarea>
    <label for="estado">Estado</label>
    <select id="estado" name="estado" [(ngModel)]="formulario.estado">
      <option *ngFor="let estado of estados" [value]="estado">{{ estado }}</option>
    </select>
    <div class="acciones">
      <button type="submit" [disabled]="tareaForm.invalid">{{ editandoId === null ? 'Crear tarea' : 'Guardar cambios' }}</button>
      <button type="button" class="secundario" *ngIf="editandoId !== null" (click)="cancelarEdicion()">Cancelar</button>
    </div>
  </form>
  <p class="exito" *ngIf="mensaje" role="status">{{ mensaje }}</p>
  <p class="error" *ngIf="error" role="alert">{{ error }}</p>
  <section aria-labelledby="lista-tareas">
    <h2 id="lista-tareas">Tareas</h2>
    <p *ngIf="tareas.length === 0">No hay tareas registradas.</p>
    <article class="tarea" *ngFor="let tarea of tareas">
      <div><h3>{{ tarea.titulo }}</h3><p>{{ tarea.descripcion || 'Sin descripción' }}</p><span class="estado">{{ tarea.estado }}</span></div>
      <div class="acciones"><button type="button" (click)="editar(tarea)">Editar</button><button type="button" class="peligro" (click)="eliminar(tarea.id)">Eliminar</button></div>
    </article>
  </section>
</main>
